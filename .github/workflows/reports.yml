name: period-reports

# 끝난 기간의 리포트는 daily-curation이 매일 자동으로 확정한다.
# 이 워크플로는 진행 중인 기간 미리 보기나 특정 기간 재생성을 수동으로 돌릴 때 쓴다.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "리포트 종류"
        type: choice
        options: [week, month, year]
        default: week
      period:
        description: "2026-W43 · 2026-10 · 2026 형식 (비우면 Asia/Seoul 기준 오늘이 속한 기간)"
        required: false

permissions:
  contents: write

# daily-curation과 같은 그룹: 결과 커밋이 서로 겹치지 않게 순서대로 실행한다
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install (uv.lock 고정)
        run: uv sync --frozen --extra dev

      - name: 리포트 생성 (data/ 집계)
        env:
          KIND: ${{ inputs.kind }}
          PERIOD: ${{ inputs.period }}
        run: |
          args=(report "$KIND")
          [ -n "$PERIOD" ] && args+=(--period "$PERIOD")
          uv run llm-news "${args[@]}"

      - name: 결과 커밋
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git config user.name "llm-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports README.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "report: ${KIND} 리포트 갱신"
          git pull --rebase
          git push
