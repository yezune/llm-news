[project]
name = "llm-news"
version = "0.1.0"
description = "매일 1회 LLM 소식을 큐레이션하고, 각 주장(claim)을 검증하는 파이프라인"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "sympy>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
llm-news = "llm_news.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 실제 Hugging Face/arXiv에 접속하는 테스트 (기본 제외, -m network 로 실행)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
